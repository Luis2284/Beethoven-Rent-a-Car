<div class="animate-enter flex justify-center p-8">
    <div
        class="w-full max-w-2xl bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-800 dark:text-white mb-1">{{ isEditMode ? 'Editar Vehículo' :
                'Nuevo Vehículo' }}</h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium">Ingresa los detalles del carro</p>
        </div>

        <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">

            <!-- Image Upload Section -->
            <div
                class="flex flex-col items-center gap-4 p-6 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700 hover:border-blue-400 transition-colors">
                <div
                    class="relative w-full h-48 bg-slate-100 dark:bg-slate-800 rounded-xl overflow-hidden flex items-center justify-center group">

                    <!-- Loading Spinner -->
                    <div *ngIf="isUploadingImage"
                        class="absolute inset-0 z-20 bg-white/80 dark:bg-slate-900/80 flex flex-col items-center justify-center">
                        <span class="material-symbols-outlined animate-spin text-3xl text-blue-500">sync</span>
                        <span class="text-xs font-bold text-blue-500 mt-2">Subiendo...</span>
                    </div>

                    <!-- Image Preview -->
                    <div *ngIf="vehicleForm.get('imageUrl')?.value && !isUploadingImage"
                        class="absolute inset-0 bg-cover bg-center"
                        [style.background-image]="'url(http://localhost:5159/' + vehicleForm.get('imageUrl')?.value + ')'">
                    </div>

                    <!-- Placeholder -->
                    <div *ngIf="!vehicleForm.get('imageUrl')?.value && !isUploadingImage"
                        class="text-slate-300 dark:text-slate-600">
                        <span class="material-symbols-outlined text-6xl">directions_car</span>
                    </div>

                    <!-- Overlay -->
                    <div
                        class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center z-10">
                        <button type="button" (click)="fileInput.click()"
                            class="text-white font-medium flex items-center gap-2">
                            <span class="material-symbols-outlined">cloud_upload</span> Cambiar Foto
                        </button>
                    </div>
                </div>

                <div class="text-center" *ngIf="!vehicleForm.get('imageUrl')?.value">
                    <button type="button" (click)="fileInput.click()"
                        class="text-blue-600 font-bold text-sm hover:underline">
                        Subir Foto
                    </button>
                    <p class="text-xs text-slate-400 mt-1">PNG, JPG hasta 5MB</p>
                </div>

                <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden">
            </div>

            <!-- Row 1 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Plate -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Placa</label>
                    <input type="text" formControlName="plate" placeholder="ABC-123"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all uppercase placeholder:normal-case">
                    <p *ngIf="vehicleForm.get('plate')?.touched && vehicleForm.get('plate')?.hasError('required')"
                        class="text-red-500 text-xs mt-1 font-medium flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">error</span> Requerido
                    </p>
                </div>

                <!-- Color -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Color</label>
                    <input type="text" formControlName="color" placeholder="Ej: Rojo"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    <p *ngIf="vehicleForm.get('color')?.touched && vehicleForm.get('color')?.hasError('required')"
                        class="text-red-500 text-xs mt-1 font-medium flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">error</span> Requerido
                    </p>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Brand -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Marca</label>
                    <input type="text" formControlName="brand" placeholder="Ej: Hyundai"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    <p *ngIf="vehicleForm.get('brand')?.touched && vehicleForm.get('brand')?.hasError('required')"
                        class="text-red-500 text-xs mt-1 font-medium flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">error</span> Requerido
                    </p>
                </div>

                <!-- Model -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Modelo</label>
                    <input type="text" formControlName="model" placeholder="Ej: i10"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    <p *ngIf="vehicleForm.get('model')?.touched && vehicleForm.get('model')?.hasError('required')"
                        class="text-red-500 text-xs mt-1 font-medium flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">error</span> Requerido
                    </p>
                </div>
            </div>

            <!-- Year -->
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Año</label>
                <input type="number" formControlName="year"
                    class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                <p *ngIf="vehicleForm.get('year')?.touched && vehicleForm.get('year')?.hasError('required')"
                    class="text-red-500 text-xs mt-1 font-medium flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">error</span> Requerido
                </p>
            </div>

            <!-- Administrator -->
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Administrador /
                    Dueño</label>
                <div class="relative">
                    <select formControlName="administratorId"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none cursor-pointer">
                        <option *ngFor="let admin of administrators" [value]="admin.id">
                            {{admin.name}}
                        </option>
                    </select>
                    <span
                        class="material-symbols-outlined absolute right-4 top-3.5 pointer-events-none text-slate-400">expand_more</span>
                </div>
                <p *ngIf="vehicleForm.get('administratorId')?.touched && vehicleForm.get('administratorId')?.invalid"
                    class="text-red-500 text-xs mt-1 font-medium flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">error</span> Requerido
                </p>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Descripción</label>
                <textarea formControlName="description" rows="3"
                    class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"></textarea>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-100 dark:border-slate-700 mt-2">
                <button type="button" (click)="onCancel()"
                    class="px-6 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                    CANCELAR
                </button>
                <button type="submit" [disabled]="vehicleForm.invalid"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-8 rounded-xl shadow-lg shadow-blue-600/20 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-95">
                    {{ isEditMode ? 'GUARDAR CAMBIOS' : 'REGISTRAR' }}
                </button>
            </div>

        </form>
    </div>
</div>
