<div class="p-8">
    <h1 class="text-2xl font-bold mb-6 text-slate-800 dark:text-white">Gestor de Notificaciones</h1>

    <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 mb-8">
        <form [formGroup]="notificationForm" (ngSubmit)="sendNotification()" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Título</label>
                <input formControlName="title" type="text"
                    class="w-full px-4 py-2 border rounded-lg bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Cliente
                    (Opcional)</label>
                <select formControlName="clientId"
                    class="w-full px-4 py-2 border rounded-lg bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white">
                    <option [value]="null">Todos</option>
                    <option *ngFor="let client of clients" [value]="client.id">{{client.name}}</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Mensaje</label>
                <textarea formControlName="message" rows="3"
                    class="w-full px-4 py-2 border rounded-lg bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white"></textarea>
            </div>

            <button type="submit" [disabled]="isSending"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition">
                {{ isSending ? 'Enviando...' : 'Enviar Notificación' }}
            </button>
        </form>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
                <tr>
                    <th class="p-4 text-xs font-bold text-slate-500 uppercase">Fecha</th>
                    <th class="p-4 text-xs font-bold text-slate-500 uppercase">Título</th>
                    <th class="p-4 text-xs font-bold text-slate-500 uppercase">Mensaje</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                <tr *ngFor="let item of history">
                    <td class="p-4">{{item.createdAt | date:'short'}}</td>
                    <td class="p-4 font-bold">{{item.title}}</td>
                    <td class="p-4 text-sm">{{item.message}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
