<div class="p-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Gastos del Vehículo</h1>
            <p *ngIf="vehicle" class="text-slate-500">{{vehicle.brand}} {{vehicle.model}} - {{vehicle.plate}}</p>
        </div>
        <button (click)="toggleForm()"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 transition">
            {{ showForm ? 'Cancelar' : 'Nuevo Gasto' }}
        </button>
    </div>

    <!-- Form -->
    <div *ngIf="showForm"
        class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 mb-8 animate-enter">
        <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Fecha</label>
                <input type="date" formControlName="date"
                    class="w-full px-4 py-2 border rounded-lg bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Tipo</label>
                <select formControlName="type"
                    class="w-full px-4 py-2 border rounded-lg bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white">
                    <option value="Mantenimiento">Mantenimiento</option>
                    <option value="Reparación">Reparación</option>
                    <option value="Impuesto">Impuesto</option>
                    <option value="Seguro">Seguro</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Monto</label>
                <input type="number" formControlName="amount"
                    class="w-full px-4 py-2 border rounded-lg bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Descripción</label>
                <input type="text" formControlName="description"
                    class="w-full px-4 py-2 border rounded-lg bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white">
            </div>

            <div class="md:col-span-2 flex justify-end mt-4">
                <button type="submit" [disabled]="expenseForm.invalid || isLoading"
                    class="bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-emerald-700 transition disabled:opacity-50">
                    Guardar Gasto
                </button>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
                <tr>
                    <th class="p-4 text-xs font-bold text-slate-500 uppercase">Fecha</th>
                    <th class="p-4 text-xs font-bold text-slate-500 uppercase">Tipo</th>
                    <th class="p-4 text-xs font-bold text-slate-500 uppercase">Descripción</th>
                    <th class="p-4 text-xs font-bold text-slate-500 uppercase">Monto</th>
                    <th class="p-4 text-xs font-bold text-slate-500 uppercase">Acciones</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                <tr *ngFor="let expense of expenses">
                    <td class="p-4 text-slate-500">{{expense.date | date:'shortDate'}}</td>
                    <td class="p-4 font-bold">{{expense.type}}</td>
                    <td class="p-4 text-sm">{{expense.description}}</td>
                    <td class="p-4 font-bold text-red-600">${{expense.amount | number}}</td>
                    <td class="p-4">
                        <button (click)="deleteExpense(expense.id)"
                            class="text-red-500 hover:text-red-700 font-bold text-sm">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
